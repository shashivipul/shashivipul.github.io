#  appeared. "color" picks the tile's accent: teal, indigo, rose, amber, violet.
#  Set "current: true" to mark what you are working on right now.
#  "link" is where the tile goes when clicked (optional).
# =============================================================================

summary: >-
  My research develops theoretical and optimization-driven methods for
  **trustworthy machine learning** on graph-structured and biomedical data:
  systems that stay *fair*, *robust*, *privacy-aware*, *well-calibrated* and
  *efficient* when they leave the lab. During my Ph.D. this has meant
  certifiably robust and fair graph neural networks, fairness-aware GNN-to-MLP
  knowledge distillation for fast graph-free inference, optimization-based
  graph coarsening, and equity-aware self-supervised learning for neuroimaging.
  At Fujitsu Research, I am carrying these questions to systems that evolve
  over time: self-evolving AI agents and anomaly detection in dynamic graphs.

