# =============================================================================
#  Travel page data  (/travel/)
# =============================================================================
#
#  HOW TO ADD A NEW TRIP
#  1. If the country is new, add it under "countries" (copy any entry).
#     - id: a short code you choose (ISO codes like FR, JP work well)
#     - lat / lon: where the dot sits on the map (a city or the country centre)
#     - map_id: the country's ISO 3166 numeric code, used to shade it on the
#       map (look it up on Wikipedia, e.g. Japan = 392). Optional.
#  2. Add the trip under "trips": the year and the route as a list of ids,
#     in the order you travelled. Each consecutive pair becomes an arrow.
#
#  HOW TO ADD PHOTOS
#  1. Put the image files in the folder  images/travel/
#     (JPG or WebP, about 1600px on the long side keeps the page fast).
#  2. List them under that country's "photos" with an optional caption:
#       photos:
#         - file: paris-eiffel.jpg
#           caption: "Eiffel Tower at dusk"
#
# =============================================================================

